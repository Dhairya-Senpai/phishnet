services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-phishnet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-phishnet}
      POSTGRES_DB: ${POSTGRES_DB:-phishnet}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phishnet"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-phishnet}:${POSTGRES_PASSWORD:-phishnet}@db:5432/${POSTGRES_DB:-phishnet}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
      - mail_data:/var/mail/phishnet
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-phishnet}:${POSTGRES_PASSWORD:-phishnet}@db:5432/${POSTGRES_DB:-phishnet}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ./backend:/app
      - mail_data:/var/mail/phishnet
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.worker worker --loglevel=info --concurrency=4

  postfix:
    build:
      context: ./infrastructure/postfix
      dockerfile: Dockerfile
    environment:
      PHISHNET_API_URL: http://backend:8000
      PHISHNET_API_KEY: ${API_KEY:-change-me-in-production}
    ports:
      - "2525:2525"
    depends_on:
      - backend
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    env_file: .env
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - backend
    command: npm run dev

  nginx:
    image: nginx:alpine
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend
    profiles:
      - production

volumes:
  postgres_data:
  redis_data:
  mail_data:
